[project]
name = "nigehbaan"
version = "1.0.0"
description = "Zero-knowledge password & secret vault — AES-256-GCM + argon2id"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
extend-ignore = ["B008"]  # FastAPI idiom: Depends() in argument defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
